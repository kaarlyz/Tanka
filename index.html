<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tanka - AI Autonomous Study Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Manrope:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- KaTeX CSS for publication-grade mathematical formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <style>
      :root {
        --figma-bg: #eef1eb;
        --figma-sidebar: #18221f;
        --figma-card: #ffffff;
        --figma-lime: #c8f064;
        --figma-border: #dde1da;
        --figma-text: #17201d;
        --figma-muted: #6f7975;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Manrope', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #eef1eb;
        color: #17201d;
        min-height: 100dvh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        letter-spacing: -0.01em;
      }
      code, pre, .mono, .font-mono {
        font-family: 'DM Mono', 'JetBrains Mono', "FiraCode Nerd Font", ui-monospace, monospace;
      }

      /* 3D Flashcard Stage and Animation */
      .flashcard-stage {
        perspective: 1200px;
        width: 100%;
        max-width: 680px;
        margin: 0 auto;
      }
      .flashcard-card {
        position: relative;
        width: 100%;
        min-height: 320px;
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
        user-select: none;
      }
      .flashcard-card.flipped {
        transform: rotateY(180deg);
      }
      .flashcard-face {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        border-radius: 12px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 32px;
        box-sizing: border-box;
        border: 1px solid #dde1da;
        box-shadow: 0 10px 35px rgba(27, 39, 35, 0.08);
      }
      .flashcard-front {
        background: #ffffff;
        color: #17201d;
        transform: rotateY(0deg);
      }
      .flashcard-back {
        background: #18221f;
        color: #eff5ec;
        border-color: #34413c;
        box-shadow: 0 10px 35px rgba(27, 39, 35, 0.15);
        transform: rotateY(180deg);
      }

      /* Scrollbars */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #f8f9f5;
      }
      ::-webkit-scrollbar-thumb {
        background: #dce1da;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b8c2b5;
      }

      /* No scrollbar utility */
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Mobile Responsive Adaptations */
      @media (max-width: 768px) {
        .desktop-only {
          display: none !important;
        }
        .mobile-only {
          display: flex !important;
        }

        /* App shell: vertical stack on mobile */
        .app-shell {
          flex-direction: column !important;
          height: 100dvh !important;
          width: 100vw !important;
          overflow: hidden !important;
        }

        /* Sidebar becomes slide-out drawer */
        .sidebar-drawer {
          position: fixed !important;
          top: 0;
          left: 0;
          bottom: 0;
          width: 82% !important;
          max-width: 310px !important;
          z-index: 1000 !important;
          background-color: #18221f !important;
          box-shadow: 15px 0 40px rgba(0, 0, 0, 0.4) !important;
          transform: translateX(-100%);
          transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1) !important;
        }
        .sidebar-drawer.open {
          transform: translateX(0) !important;
        }
        .drawer-overlay {
          position: fixed;
          inset: 0;
          background: rgba(24, 34, 31, 0.6);
          backdrop-filter: blur(4px);
          z-index: 999;
          animation: fadeIn 0.2s ease;
        }

        /* Workspace shell fills available space */
        .workspace-shell {
          height: 100dvh !important;
          max-height: 100dvh !important;
          flex: 1 !important;
          min-width: 0 !important;
        }

        /* Topbar compact */
        .topbar-bar {
          height: 52px !important;
          padding: 0 12px !important;
          gap: 6px !important;
        }
        .topbar-eyebrow {
          display: none !important;
        }
        .topbar-title {
          font-size: 14px !important;
          max-width: 140px !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
          white-space: nowrap !important;
        }

        /* Figma grid: single column, fill height */
        .figma-grid {
          grid-template-columns: 1fr !important;
          height: calc(100dvh - 52px) !important;
          max-height: calc(100dvh - 52px) !important;
          overflow-y: auto !important;
          overflow-x: hidden !important;
        }

        /* Lesson panel: auto height, no fixed height */
        .lesson-panel-box {
          height: auto !important;
          max-height: none !important;
          overflow-y: visible !important;
          border-right: none !important;
          padding: 0 !important;
        }

        /* Tab bar: horizontal scroll */
        .tab-bar-container {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          display: flex !important;
          flex-wrap: nowrap !important;
          padding: 0 10px !important;
          height: 44px !important;
          gap: 4px !important;
        }
        .tab-btn {
          white-space: nowrap !important;
          padding: 5px 10px !important;
          font-size: 11.5px !important;
          flex-shrink: 0 !important;
          min-height: 32px !important;
        }

        /* Main content area */
        .main-content-area {
          padding: 14px 12px 24px !important;
          overflow-y: visible !important;
        }

        /* Cards: fill width, compact padding */
        .learning-card-white {
          padding: 16px 14px !important;
          border-radius: 12px !important;
          margin-bottom: 14px !important;
        }

        /* Quiz options: full width stack */
        .quiz-option-btn {
          padding: 12px 12px !important;
          font-size: 13px !important;
          min-height: 48px !important;
        }

        /* CBT exam grid: wrap tighter */
        .quiz-action-bar {
          flex-direction: column !important;
          width: 100% !important;
          gap: 10px !important;
        }
        .action-chips-grid {
          display: grid !important;
          grid-template-columns: 1fr !important;
          gap: 8px !important;
          width: 100% !important;
        }
        .action-chips-grid button {
          width: 100% !important;
          justify-content: center !important;
          min-height: 44px !important;
        }
        .quiz-ask-ai-btn,
        .next-quiz-btn {
          width: 100% !important;
          justify-content: center !important;
          padding: 13px 0 !important;
          min-height: 48px !important;
          font-size: 13.5px !important;
        }

        /* Flashcards: shorter on mobile */
        .flashcard-stage {
          max-width: 100% !important;
        }
        .flashcard-card {
          min-height: 240px !important;
        }
        .flashcard-face {
          padding: 18px !important;
        }
        .flashcard-front h2, .flashcard-card .card-q {
          font-size: 15px !important;
        }

        /* Spaced rep rating grid */
        .spaced-rep-grid {
          grid-template-columns: repeat(2, 1fr) !important;
          gap: 8px !important;
        }
        .spaced-rep-grid button {
          min-height: 44px !important;
          font-size: 13px !important;
        }

        /* Code/formula blocks: horizontal scroll */
        .code-sample-dark {
          overflow-x: auto !important;
          font-size: 11px !important;
          padding: 12px !important;
        }
        .katex-block-wrapper {
          overflow-x: auto !important;
          -webkit-overflow-scrolling: touch !important;
          max-width: 100% !important;
        }
        .katex { font-size: 0.92em !important; }

        /* Footer bar */
        .lesson-footer-bar {
          height: auto !important;
          padding: 10px 12px !important;
          flex-wrap: wrap !important;
          gap: 8px !important;
        }
        .course-progress-bar {
          width: 100px !important;
        }

        /* Prevent iOS zoom on inputs */
        input[type="text"], textarea, select {
          font-size: 16px !important;
        }

        /* Metrics cards */
        .metrics-grid {
          grid-template-columns: 1fr !important;
          gap: 8px !important;
        }
        .quick-actions-grid {
          flex-direction: column !important;
        }
        .quick-actions-grid button {
          width: 100% !important;
          justify-content: center !important;
          padding: 12px 16px !important;
        }
      }

      @media (min-width: 769px) {
        .mobile-only {
          display: none !important;
        }
        .drawer-overlay {
          display: none !important;
        }
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      /* --- Figma Make "nalar." Design System Classes --- */
      .app-shell {
        display: flex;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
        background: #eef1eb;
      }
      .figma-sidebar {
        width: 254px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 16px 14px 14px;
        color: #eff5ec;
        background: #18221f;
        border-right: 1px solid rgba(255, 255, 255, 0.06);
        height: 100vh;
        overflow-y: auto;
      }
      .brand-box {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 0 10px 24px;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -1px;
        color: #eff5ec;
      }
      .brand-symbol-box {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: #17201d;
        background: #c8f064;
        border-radius: 8px 8px 8px 2px;
        font-size: 18px;
        font-weight: 800;
        font-family: 'DM Mono', monospace;
      }
      .main-nav {
        display: grid;
        gap: 6px;
      }
      .figma-nav-link {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 12px;
        color: #aeb9b4;
        border-radius: 9px;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        transition: 160ms ease;
        background: transparent;
        border: none;
        cursor: pointer;
        width: 100%;
        text-align: left;
      }
      .figma-nav-link:hover,
      .figma-nav-link.active {
        color: #f5f8f3;
        background: #25322e;
      }
      .figma-nav-link.active {
        box-shadow: inset 3px 0 #c8f064;
      }
      .side-mark-box {
        width: 25px;
        height: 25px;
        display: grid;
        place-items: center;
        color: #86938e;
        border: 1px solid #45514d;
        border-radius: 7px;
        font-family: "DM Mono", monospace;
        font-size: 10.5px;
        flex-shrink: 0;
      }
      .figma-nav-link.active .side-mark-box {
        color: #c8f064;
        border-color: #657358;
      }
      .streak-card-box {
        margin: 16px 0;
        padding: 14px 15px;
        background: #212d29;
        border: 1px solid #34413c;
        border-radius: 12px;
      }
      .streak-top-row {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #b3bcb8;
      }
      .streak-top-row strong {
        color: #d6f58d;
      }
      .streak-bar-box {
        height: 5px;
        margin: 10px 0 8px;
        overflow: hidden;
        background: #3d4945;
        border-radius: 8px;
      }
      .streak-bar-fill {
        display: block;
        height: 100%;
        background: #c8f064;
        border-radius: 8px;
      }
      .streak-card-box p {
        margin: 0;
        color: #899590;
        font-size: 10.5px;
        line-height: 1.45;
      }
      .profile-row-box {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px;
        text-align: left;
        background: transparent;
        border: 0;
        cursor: pointer;
      }
      .avatar-box {
        width: 34px;
        height: 34px;
        display: grid;
        flex: 0 0 auto;
        place-items: center;
        color: #202a27;
        background: #ddd7ca;
        border-radius: 50%;
        font-size: 11px;
        font-weight: 800;
        font-family: 'DM Mono', monospace;
      }
      .profile-row-box strong {
        display: block;
        color: #edf1ef;
        font-size: 11.5px;
      }
      .profile-row-box small {
        display: block;
        margin-top: 2px;
        color: #7f8c87;
        font-size: 9.5px;
      }
      .profile-more-dots {
        margin-left: auto;
        color: #6e7c77;
        font-size: 11px;
      }
      .workspace-shell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-height: 100vh;
        overflow: hidden;
      }
      .topbar-bar {
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: rgba(248, 249, 245, 0.96);
        border-bottom: 1px solid #dce1da;
        position: sticky;
        top: 0;
        z-index: 10;
        backdrop-filter: blur(8px);
      }
      .topbar-eyebrow {
        display: block;
        margin-bottom: 2px;
        color: #88918d;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 1.4px;
        font-family: 'DM Mono', monospace;
      }
      .topbar-title {
        margin: 0;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: -0.5px;
        color: #17201d;
      }
      .session-status-badge {
        display: flex;
        align-items: center;
        gap: 7px;
        color: #75807c;
        font-size: 10.5px;
        font-weight: 600;
      }
      .session-status-badge i {
        width: 6px;
        height: 6px;
        background: #72a728;
        border-radius: 50%;
        box-shadow: 0 0 0 3px rgba(114, 167, 40, 0.15);
      }
      .figma-grid {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(320px, 380px);
        flex: 1;
        height: calc(100vh - 64px - 58px);
        max-height: calc(100vh - 64px - 58px);
        overflow: hidden;
      }
      .lesson-panel-box {
        padding: 24px 28px 30px;
        background: #f8f9f5;
        border-right: 1px solid #dce1da;
        overflow-y: auto;
        height: 100%;
        box-sizing: border-box;
      }
      .ai-panel-box {
        background: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px 22px;
        border-left: 1px solid #dce1da;
        height: 100%;
        max-height: 100%;
        overflow-y: auto;
        box-sizing: border-box;
      }
      .ai-heading-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 16px;
        border-bottom: 1px solid #e7ece5;
      }
      .ai-orbit-box {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        color: #17201d;
        background: #c8f064;
        border-radius: 50%;
        font-size: 12px;
        font-weight: 800;
        font-family: 'DM Mono', monospace;
      }
      .online-label-box {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #4b6623;
        font-size: 10px;
        font-weight: 700;
        background: #eef7de;
        padding: 3px 8px;
        border-radius: 999px;
      }
      .online-label-box i {
        width: 5px;
        height: 5px;
        background: #72a728;
        border-radius: 50%;
      }
      .chat-window-box {
        flex: 1;
        overflow-y: auto;
        padding: 16px 0;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .ai-note-box {
        background: #f4f7f1;
        border: 1px solid #dce4d7;
        border-radius: 10px;
        padding: 12px 14px;
        font-size: 12px;
        color: #55625d;
        line-height: 1.5;
      }
      .prompt-chips-box {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 12px;
      }
      .prompt-chip-btn {
        padding: 6px 10px;
        background: #f4f6f2;
        border: 1px solid #dde3db;
        border-radius: 7px;
        font-size: 11px;
        font-weight: 600;
        color: #56645e;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .prompt-chip-btn:hover {
        background: #e9eee6;
        color: #17201d;
        border-color: #cbd4c8;
      }
      .chat-form-box {
        display: flex;
        gap: 8px;
        background: #f4f6f2;
        border: 1px solid #dbe2d8;
        border-radius: 10px;
        padding: 6px 8px;
      }
      .chat-form-box input {
        flex: 1;
        background: transparent;
        border: none;
        outline: none;
        font-size: 12.5px;
        color: #17201d;
        padding: 4px 6px;
      }
      .chat-form-box button {
        width: 30px;
        height: 30px;
        border-radius: 7px;
        background: #18221f;
        color: #c8f064;
        border: none;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 800;
        cursor: pointer;
        transition: 0.15s ease;
      }
      .chat-form-box button:hover {
        background: #25332e;
      }
      /* Nara AI markdown response styling */
      .nara-md-response p { margin: 0 0 6px; }
      .nara-md-response p:last-child { margin-bottom: 0; }
      .nara-md-response ul, .nara-md-response ol { margin: 4px 0; padding-left: 18px; }
      .nara-md-response li { margin-bottom: 2px; }
      .nara-md-response code { background: #e8ede5; padding: 1px 4px; border-radius: 3px; font-size: 11px; }
      .nara-md-response pre { background: #1d2824; color: #e8eee9; padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 6px 0; }
      .nara-md-response pre code { background: none; padding: 0; color: inherit; }
      .nara-md-response strong { font-weight: 700; }
      .nara-md-response .katex { font-size: 0.95em; }

      /* KaTeX global overflow protection */
      .katex-block-wrapper {
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        max-width: 100% !important;
        padding: 4px 0 !important;
      }
      .katex-display {
        overflow-x: auto !important;
        overflow-y: hidden !important;
        -webkit-overflow-scrolling: touch !important;
        max-width: 100% !important;
        margin: 0.4em 0 !important;
      }
      .katex-display > .katex {
        max-width: 100% !important;
        text-align: center !important;
      }
      .lesson-footer-bar {
        height: 58px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px;
        background: #f8f9f5;
        border-top: 1px solid #dce1da;
      }
      .course-progress-box {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: #727d78;
        font-weight: 600;
      }
      .course-progress-bar {
        width: 140px;
        height: 5px;
        background: #dbe2d8;
        border-radius: 999px;
        overflow: hidden;
      }
      .course-progress-bar-fill {
        height: 100%;
        background: #72a728;
        border-radius: 999px;
      }
      .learning-card-white {
        background: #ffffff;
        border: 1px solid #dde1da;
        border-radius: 12px;
        padding: 24px 26px;
        box-shadow: 0 10px 35px rgba(27, 39, 35, 0.04);
        margin-bottom: 20px;
      }
      .code-sample-dark {
        margin-top: 18px;
        padding: 14px 16px;
        color: #e8eee9;
        background: #1d2824;
        border-radius: 10px;
        font-family: "DM Mono", monospace;
        font-size: 11.5px;
        line-height: 1.6;
      }
      @media (max-width: 1024px) {
        .figma-grid {
          grid-template-columns: 1fr;
        }
        .ai-panel-box {
          border-left: none;
          border-top: 1px solid #dce1da;
        }
      }

      /* Small screen: extra tight */
      @media (max-width: 380px) {
        .topbar-title {
          font-size: 13px !important;
          max-width: 110px !important;
        }
        .tab-btn {
          font-size: 10.5px !important;
          padding: 4px 8px !important;
        }
        .main-content-area {
          padding: 10px 8px 20px !important;
        }
        .learning-card-white {
          padding: 14px 10px !important;
        }
      }

      /* Print stylesheet for clean PDF & physical study notes */
      @media print {
        body {
          background: #ffffff !important;
          color: #000000 !important;
        }
        .sidebar-shell,
        .ai-panel-box,
        .lesson-footer-bar,
        .topbar-bar,
        .tab-bar-container,
        .desktop-only,
        .mobile-only,
        button {
          display: none !important;
        }
        .app-shell,
        .workspace-shell,
        .figma-grid,
        .main-content-area {
          display: block !important;
          width: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          border: none !important;
          background: #ffffff !important;
        }
        .learning-card-white {
          border: 1px solid #cccccc !important;
          box-shadow: none !important;
          page-break-inside: avoid;
          padding: 16px !important;
        }
      }
    </style>
  </head>
  <body>
