<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tanka - AI Autonomous Study Platform</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#19231f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tanka" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Charter&family=DM+Mono:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400..700;1,8..60,400..600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root">
      <div id="tanka-preloader" style="position:fixed;inset:0;background:#121a17;color:#eff5ec;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;font-family:-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden;">
        <style>
          @keyframes tankaPreloadPulse {
            0% { transform: scale(0.96); }
            50% { transform: scale(1.02); }
            100% { transform: scale(0.96); }
          }
          @keyframes tankaPreloadDot {
            0% { opacity: 0.5; transform: scale(0.85); }
            50% { opacity: 1; transform: scale(1.2); }
            100% { opacity: 0.5; transform: scale(0.85); }
          }
          @keyframes tankaPreloadBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
          @keyframes tankaPreloadFlow {
            0% { stroke-dashoffset: 160; }
            100% { stroke-dashoffset: 0; }
          }
        </style>

        <!-- Blueprint Background Grid -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:0.35;" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <pattern id="tp-grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d2923" stroke-width="0.8" />
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#tp-grid)" />
          <circle cx="500" cy="300" r="180" fill="none" stroke="#25352c" stroke-width="1" stroke-dasharray="4 6" />
          <path d="M500 40 V560 M240 300 H760" stroke="#25352c" stroke-width="0.8" stroke-dasharray="2 4" />
        </svg>

        <!-- Kinetic Node Arc Graphic -->
        <div style="position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;max-width:380px;width:100%;text-align:center;">
          <div style="position:relative;width:130px;height:100px;margin-bottom:8px;">
            <svg width="130" height="100" viewBox="0 0 130 100" fill="none" style="overflow:visible;">
              <path d="M 24 66 Q 65 22 106 66" fill="none" stroke="#2c3e34" stroke-width="2" stroke-dasharray="4 4" />
              <path d="M 24 66 Q 65 22 106 66" fill="none" stroke="#c8f064" stroke-width="2" stroke-dasharray="80" stroke-dashoffset="80" style="animation:tankaPreloadFlow 2.4s ease-in-out infinite;" />
              <circle cx="24" cy="66" r="6" fill="#18221f" stroke="#3a4f43" stroke-width="2" />
              <circle cx="24" cy="66" r="2.5" fill="#8da868" />
              <circle cx="106" cy="66" r="6" fill="#18221f" stroke="#3a4f43" stroke-width="2" />
              <circle cx="106" cy="66" r="2.5" fill="#c8f064" />
              <g transform="translate(39, 10)">
                <rect width="52" height="52" rx="14" fill="#18221f" stroke="#2d3d34" stroke-width="1.5" style="animation:tankaPreloadPulse 2.8s ease-in-out infinite;" />
                <circle cx="43" cy="11" r="4" fill="#c8f064" style="animation:tankaPreloadDot 1.8s ease-in-out infinite;" />
                <text x="26" y="35" text-anchor="middle" fill="#fcfdfa" font-family="'DM Mono', monospace" font-weight="800" font-size="26">t</text>
              </g>
            </svg>
          </div>

          <!-- Brand Kicker Tag -->
          <div style="display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:999px;background:#18221f;border:1px solid #2d3d34;margin-bottom:12px;">
            <span style="width:6px;height:6px;border-radius:50%;background:#c8f064;box-shadow:0 0 8px #c8f064;"></span>
            <span style="font-family:'DM Mono',monospace;font-size:11px;font-weight:600;color:#98a89c;letter-spacing:0.06em;">TANKA ENGINE</span>
          </div>

          <!-- Headline -->
          <h1 style="font-family:'Syne',sans-serif;font-weight:800;font-size:22px;letter-spacing:-0.03em;color:#fcfdfa;margin:0 0 16px 0;">Menyiapkan ruang belajar<span style="color:#c8f064;">.</span></h1>

          <!-- Precision Progress Track -->
          <div style="width:200px;height:4px;border-radius:999px;background:#1a2520;border:1px solid #26362e;overflow:hidden;position:relative;margin-bottom:14px;">
            <div style="width:45%;height:100%;border-radius:999px;background:linear-gradient(90deg,transparent,#c8f064,transparent);animation:tankaPreloadBar 1.6s cubic-bezier(0.16,1,0.3,1) infinite;"></div>
          </div>

          <span style="font-family:'DM Mono',monospace;font-size:10.5px;color:#8da868;letter-spacing:0.08em;text-transform:uppercase;">MEMUAT MODUL & KISI-KISI TKA 2026</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
